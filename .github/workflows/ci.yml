name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit (JUnit 5) + TestNG suite + Cucumber
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # GitHub sets CI=true, which LoginSteps uses to start Chrome headless.
      - name: mvn verify (unit tests via Surefire, TestNG suite via Failsafe)
        run: mvn -B --no-transfer-progress clean verify
      - name: Build the Allure report
        if: always()
        run: mvn -B --no-transfer-progress allure:report || true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/allure-results/
            target/site/allure-maven-plugin/
            target/surefire-reports/
            target/failsafe-reports/
            target/cucumber-reports.html
          if-no-files-found: ignore
